<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otter Wallet</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
--bg:#070b14;
--card:#101827;
--accent:#10b981;
--accent2:#6366f1;
--text:#fff;
--sub:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:
radial-gradient(circle at top,#172554,#070b14);
color:white;
padding:15px;
padding-bottom:90px;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
padding:15px;
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
margin-bottom:15px;
}

.user{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:linear-gradient(135deg,#10b981,#06b6d4);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
}

.network{
background:#0f172a;
padding:8px 12px;
border-radius:20px;
font-size:12px;
color:#10b981;
}

/* HERO */

.hero{
background:
linear-gradient(135deg,#10b981,#06b6d4);
padding:25px;
border-radius:25px;
text-align:center;
margin-bottom:15px;
box-shadow:0 10px 30px rgba(16,185,129,.25);
}

.hero h2{
font-size:34px;
font-weight:800;
}

.hero p{
opacity:.9;
margin-top:5px;
}

/* PRESALE */

.presale{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
padding:20px;
border-radius:25px;
border:1px solid rgba(255,255,255,.08);
margin-bottom:15px;
}

.presale h3{
margin-bottom:10px;
}

.input-group{
display:flex;
gap:10px;
margin-top:15px;
}

select,input{
flex:1;
background:#0f172a;
border:none;
padding:12px;
border-radius:12px;
color:white;
}

.buy-btn{
width:100%;
margin-top:12px;
padding:14px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
color:white;
font-weight:700;
cursor:pointer;
}

/* ASSET CARD */

.assets-title{
margin-bottom:12px;
}

.asset-card{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
padding:15px;
border-radius:20px;
margin-bottom:12px;
}

.asset-left{
display:flex;
align-items:center;
gap:12px;
}

.coin{
width:50px;
height:50px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:bold;
}

.otter{
background:linear-gradient(135deg,#f59e0b,#ea580c);
}

.usdt{
background:#26a17b;
}

.btc{
background:#f7931a;
}

.eth{
background:#627eea;
}

.asset-name{
font-weight:700;
}

.asset-sub{
font-size:12px;
color:var(--sub);
}

.balance{
text-align:right;
}

.btns{
display:flex;
gap:6px;
margin-top:5px;
}

.btn{
padding:6px 10px;
border:none;
border-radius:8px;
font-size:11px;
cursor:pointer;
font-weight:600;
}

.deposit{
background:#10b981;
color:white;
}

.withdraw{
background:#ef4444;
color:white;
}

/* BOTTOM NAV */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#0f172a;
display:flex;
justify-content:space-around;
padding:12px;
border-top:1px solid rgba(255,255,255,.08);
}

.nav-item{
text-align:center;
font-size:12px;
color:#94a3b8;
}

.nav-item i{
display:block;
font-size:20px;
margin-bottom:4px;
}

.active{
color:#10b981;
}

</style>
</head>

<body>

<div class="header">
<div class="user">
<div class="avatar">O</div>
<div>
<div style="font-weight:700">Otter User</div>
<div style="font-size:12px;color:#94a3b8">Welcome Back</div>
</div>
</div>

<div class="network">
● Otter Chain
</div>
</div>

<div class="hero">
<h2>$12,540</h2>
<p>Total Portfolio Value</p>
</div>

<div class="presale">
<h3>🚀 OTTER Presale</h3>

<p style="color:#94a3b8;font-size:13px;">
Buy OTTER before exchange listing
<br>
1 USDT = 100 OTTER
</p>

<div class="input-group">
<select>
<option>USDT</option>
<option>BTC</option>
<option>ETH</option>
</select>

<input placeholder="Amount">
</div>

<button class="buy-btn">
Buy OTTER Now
</button>
</div>

<h3 class="assets-title">Wallet Assets</h3>

<div class="asset-card">

<div class="asset-left">
<div class="coin otter">🦦</div>

<div>
<div class="asset-name">OTTER</div>
<div class="asset-sub">Presale Token</div>
</div>
</div>

<div class="balance">
<div>15,000 OTTER</div>

<div class="btns">
<button class="btn withdraw">Locked</button>
</div>

</div>

</div>

<div class="asset-card">

<div class="asset-left">
<div class="coin usdt">₮</div>

<div>
<div class="asset-name">USDT</div>
<div class="asset-sub">Balance 100.00</div>
</div>
</div>

<div class="btns">
<button class="btn deposit">Deposit</button>
<button class="btn withdraw">Withdraw</button>
</div>

</div>

<div class="asset-card">

<div class="asset-left">
<div class="coin btc">
<i class="fa-brands fa-bitcoin"></i>
</div>

<div>
<div class="asset-name">Bitcoin</div>
<div class="asset-sub">0.005 BTC</div>
</div>
</div>

<div class="btns">
<button class="btn deposit">Deposit</button>
<button class="btn withdraw">Withdraw</button>
</div>

</div>

<div class="asset-card">

<div class="asset-left">
<div class="coin eth">
<i class="fa-brands fa-ethereum"></i>
</div>

<div>
<div class="asset-name">Ethereum</div>
<div class="asset-sub">0.05 ETH</div>
</div>
</div>

<div class="btns">
<button class="btn deposit">Deposit</button>
<button class="btn withdraw">Withdraw</button>
</div>

</div>

<div class="bottom-nav">

<div class="nav-item active">
<i class="fa-solid fa-wallet"></i>
Wallet
</div>

<div class="nav-item">
<i class="fa-solid fa-coins"></i>
Earn
</div>

<div class="nav-item">
<i class="fa-solid fa-users"></i>
Team
</div>

<div class="nav-item">
<i class="fa-solid fa-gear"></i>
More
</div>

</div>

</body>
    </html>
