<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otter Wallet - Web3 Edition</title>
  
  <!-- FontAwesome Icons & TON Connect SDK -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --sub-text: #94a3b8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
      color: var(--accent);
    }

    /* TON Connect Button Container */
    #ton-connect {
      float: right;
    }

    .balance-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .balance-card h3 {
      margin: 0;
      color: var(--sub-text);
      font-size: 14px;
      font-weight: 400;
    }

    .balance-amount {
      font-size: 36px;
      font-weight: bold;
      margin: 12px 0;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn.secondary {
      background-color: #334155;
    }

    .asset-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .asset-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .asset-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .asset-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .asset-name {
      font-weight: 600;
      font-size: 16px;
    }

    .asset-sub {
      font-size: 12px;
      color: var(--sub-text);
    }

    .asset-val {
      text-align: right;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .close-btn {
      float: right;
      cursor: pointer;
      color: var(--sub-text);
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <h2><i class="fa-solid fa-otter"></i> Otter Wallet</h2>
    <!-- TON Connect Wallet Button -->
    <div id="ton-connect"></div>
  </div>

  <!-- Balance Card -->
  <div class="balance-card">
    <h3>Total Balance</h3>
    <div class="balance-amount" id="total-balance">$0.00</div>
    
    <div class="action-buttons">
      <button class="btn" onclick="sendTonTransaction()">
        <i class="fa-solid fa-arrow-down"></i> Deposit TON
      </button>

      <button class="btn secondary" onclick="alert('Withdrawals will open after Token Listing!')">
        <i class="fa-solid fa-arrow-up"></i> Withdraw
      </button>
    </div>
  </div>

  <!-- Asset List -->
  <h3>Assets</h3>
  <div class="asset-list">
    
    <div class="asset-card">
      <div class="asset-left">
        <div class="asset-icon" style="color: #0088cc;"><i class="fa-solid fa-gem"></i></div>
        <div>
          <div class="asset-name">TON</div>
          <div class="asset-sub" id="ton-status">Not Connected</div>
        </div>
      </div>
      <div class="asset-val">
        <div class="asset-name" id="ton-bal">0 TON</div>
      </div>
    </div>

    <div class="asset-card">
      <div class="asset-left">
        <div class="asset-icon" style="color: #f59e0b;"><i class="fa-solid fa-paw"></i></div>
        <div>
          <div class="asset-name">OTTER</div>
          <div class="asset-sub">Airdrop Coin</div>
        </div>
      </div>
      <div class="asset-val">
        <div class="asset-name">1,00 $OTTER</div>
      </div>
    </div>

  </div>
</div>

<script>
  // ၁။ TON Connect SDK ကို အသက်သွင်းခြင်း
  const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      // Demo Manifest URL (သင့် GitHub Pages Domain နဲ့ နောက်မှ အစားထိုးနိုင်ပါတယ်)
      manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test-manifest.json',
      buttonRootId: 'ton-connect'
  });

  let userWalletAddress = null;

  // ၂။ Wallet Connect ဖြစ်ချိန် သို့မဟုတ် Disconnect ဖြစ်ချိန် အလိုအလျောက် စစ်ဆေးခြင်း
  tonConnectUI.onStatusChange(wallet => {
      if (wallet) {
          userWalletAddress = wallet.account.address;
          document.getElementById('ton-status').innerText = "Connected";
          document.getElementById('ton-status').style.color = "#4ade80";
          
          // Address အတိုလေး ပြပေးရန်
          const shortAddr = userWalletAddress.substring(0, 4) + "..." + userWalletAddress.substring(userWalletAddress.length - 4);
          alert("Wallet ချိတ်ဆက်မှု အောင်မြင်ပါသည်: " + shortAddr);
      } else {
          userWalletAddress = null;
          document.getElementById('ton-status').innerText = "Not Connected";
          document.getElementById('ton-status').style.color = "#94a3b8";
      }
  });

  // ၃။ TON Deposit လုပ်ရန် Wallet သို့ Transaction Request ပို့ခြင်း
  async function sendTonTransaction() {
      if (!userWalletAddress) {
          alert("ကျေးဇူးပြု၍ ညာဘက်အပေါ်ဒေါောင့်ရှိ 'Connect Wallet' ကို အရင်နှိပ်ပေးပါဗျာ!");
          return;
      }

      // ငွေတောင်းခံမည့် Transaction Details
      const transaction = {
          validUntil: Math.floor(Date.now() / 1000) + 600, // 10 မိနစ်အတွင်း
          messages: [
              {
                  // သင့်ရဲ့ TON Wallet Address အစစ်ထည့်ရန်
                  address: "EQD________________________________________", 
                  amount: "1000000000" // 1 TON = 1,000,000,000 nanoTON
              }
          ]
      };

      try {
          // User ရဲ့ Wallet App (Tonkeeper/Telegram Wallet) ပွင့်လာပြီး Confirm တောင်းမည်
          const result = await tonConnectUI.sendTransaction(transaction);
          alert("Deposit အောင်မြင်ပါသည်။ Transaction Hash: " + result.boc);
      } catch (e) {
          console.error(e);
          alert("Transaction ကို ပယ်ဖျက်လိုက်ပါသည် သို့မဟုတ် မအောင်မြင်ပါ။");
      }
  }
</script>

</body>
</html>
